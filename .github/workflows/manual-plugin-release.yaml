name: Manual Plugin OCI Release

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Comma-separated plugin release tags, each in format pluginName/version (e.g. thanos/0.14.1, trust-manager/0.24.4)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Parse and validate tags
        id: parse
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const raw = `${{ inputs.tags }}`;
            const reserved = new Set(['.github', 'LICENSES']);
            const items = [];
            const errors = [];

            const tags = raw.split(',').map(t => t.trim()).filter(t => t.length > 0);

            if (tags.length === 0) {
              core.setFailed('No tags provided');
              return;
            }

            for (const tag of tags) {
              const slashIdx = tag.lastIndexOf('/');
              if (slashIdx <= 0 || slashIdx === tag.length - 1) {
                errors.push(`'${tag}': must be in format 'pluginName/version'`);
                continue;
              }

              const name = tag.substring(0, slashIdx);
              const version = tag.substring(slashIdx + 1);

              if (reserved.has(name)) {
                errors.push(`'${tag}': '${name}' is a reserved directory and cannot be released`);
                continue;
              }

              items.push({ tag, name, version });
            }

            if (errors.length > 0) {
              core.setFailed(`Invalid tag(s):\n - ${errors.join('\n - ')}`);
              return;
            }

            core.setOutput('matrix', JSON.stringify(items));
            core.info(`Releasing ${items.length} plugin(s): ${items.map(i => i.tag).join(', ')}`);

  release:
    needs: [prepare]
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
      packages: write
    name: Release ${{ matrix.item.tag }}
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ matrix.item.tag }}

      - name: Validate plugin directory
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plugin = '${{ matrix.item.name }}';

            if (!fs.existsSync(plugin)) {
              core.setFailed(`Plugin directory '${plugin}' does not exist at tag '${{ matrix.item.tag }}'`);
              return;
            }

            if (!fs.existsSync(`${plugin}/plugindefinition.yaml`)) {
              core.setFailed(`Plugin '${plugin}' is missing plugindefinition.yaml`);
              return;
            }

            core.info(`Validated plugin directory: ${plugin}`);

      - name: Install oras
        run: |
          ORAS_VERSION="1.2.0"
          curl -sSfL \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/oras.tar.gz
          tar -xzf /tmp/oras.tar.gz -C /tmp oras
          sudo mv /tmp/oras /usr/local/bin/oras
          oras version

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push plugin OCI artifact to GHCR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const plugin = '${{ matrix.item.name }}';
            const version = '${{ matrix.item.version }}';
            const target = `${{ env.REGISTRY }}/${{ github.repository }}/plugindefinition/${plugin}:${version}`;

            await exec.exec('oras', [
              'push', target,
              '--config', '/dev/null:application/vnd.greenhouse.plugin.config.v1+json',
              `${plugin}/plugindefinition.yaml:application/vnd.greenhouse.plugindefinition.v1+yaml`,
            ]);

            core.info(`Published plugindefinition/${plugin}:${version} → ${target}`);
